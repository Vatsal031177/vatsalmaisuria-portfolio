<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Vatsal Maisuria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <a href="index.html" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </a>
                    <h1 class="text-xl font-extrabold tracking-tight">Admin <span class="text-indigo-600">Inbox</span></h1>
                </div>
                <button onclick="clearMessages()" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors uppercase tracking-widest">Clear All</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
            <div id="noMessages" class="hidden text-center py-20 bg-white rounded-[2rem] border border-dashed border-slate-200">
                <div class="flex flex-col items-center gap-4">
                    <div class="p-6 bg-slate-50 text-slate-300 rounded-full"><i data-lucide="inbox" class="w-12 h-12"></i></div>
                    <div>
                        <h3 class="text-xl font-bold text-slate-400">Your inbox is empty</h3>
                        <p class="text-slate-400 text-sm">New messages from your portfolio will appear here.</p>
                    </div>
                </div>
            </div>

            <div id="messageList" class="grid gap-6">
                <!-- Messages will be injected here -->
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('portfolio_messages') || '[]');
            const list = document.getElementById('messageList');
            const emptyState = document.getElementById('noMessages');

            if (messages.length === 0) {
                list.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            list.innerHTML = messages.reverse().map(msg => `
                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm hover:border-indigo-200 transition-all group">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="text-xl font-bold mb-1">${msg.name}</h3>
                            <p class="text-sm text-indigo-600 font-semibold">${msg.email}</p>
                        </div>
                        <span class="text-xs font-bold text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full uppercase tracking-wider">${msg.date}</span>
                    </div>
                    <div class="mb-4">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Subject</span>
                        <p class="font-bold text-slate-800">${msg.subject}</p>
                    </div>
                    <div>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Message Content</span>
                        <p class="text-slate-600 leading-relaxed">${msg.message}</p>
                    </div>
                    <div class="mt-8 pt-6 border-t border-slate-50 flex justify-end">
                        <button onclick="deleteMessage(${msg.id})" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function deleteMessage(id) {
            let messages = JSON.parse(localStorage.getItem('portfolio_messages') || '[]');
            messages = messages.filter(m => m.id !== id);
            localStorage.setItem('portfolio_messages', JSON.stringify(messages));
            loadMessages();
        }

        function clearMessages() {
            if (confirm('Are you sure you want to clear all messages?')) {
                localStorage.removeItem('portfolio_messages');
                loadMessages();
            }
        }

        loadMessages();
    </script>
</body>
</html>
